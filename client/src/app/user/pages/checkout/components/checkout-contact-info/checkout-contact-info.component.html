<div class="checkout-contact-info">
  <h4 class="checkout-contact-info__title">Ваші контактні дані</h4>
  @if (isFormExpanded) {
    <app-contact-form
      [contactInfoForm]="contactInfoForm()"
      (toggleForm)="toggle(false)"
    />
  } @else {
    <button class="checkout-contact-info__button" (click)="toggle(true)">
      <div class="checkout-contact-info__button-inner">
        <svg-icon
          class="checkout-contact-info__icon"
          src="assets/images/male-icon.svg"
        ></svg-icon>
        <span>
          {{ contactInfoForm().getRawValue().lastName }}
          {{ contactInfoForm().getRawValue().firstName }}
        </span>
      </div>
      <span class="checkout-contact-info__edit">Змінити</span>
    </button>
  }
</div>
