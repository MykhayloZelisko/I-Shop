@let categories = (categories$ | async) ?? [];

<div class="catalog">
  <app-large-catalog
    appClickOutside
    class="catalog__large"
    [categories]="categories"
  />
  <app-small-catalog
    appClickOutside
    class="catalog__small"
    [categories]="categories"
    [dialog]="dialog()"
  />
</div>
