<div class="registration-form">
  <div [formGroup]="registrationForm" class="registration-form__form">
    <app-input
      label="Електронна пошта"
      placeholder="Введіть електронну пошту"
      inputType="email"
      formControlName="email"
      [withErrors]="true"
    />
    <app-input
      label="Ім'я"
      placeholder="Введіть ім'я"
      formControlName="firstName"
      [withErrors]="true"
    />
    <app-input
      label="Прізвище"
      placeholder="Введіть прізвище"
      formControlName="lastName"
      [withErrors]="true"
    />
    <app-input
      label="Номер телефону"
      placeholder="+380 (XX) XXX-XX-XX"
      formControlName="phone"
      [withErrors]="true"
      mask="(00) 000-00-00"
      prefix="+380 "
      [showMaskTyped]="true"
      [dropSpecialCharacters]="true"
    />
    <app-input
      label="Пароль"
      placeholder="Введіть пароль"
      inputType="password"
      formControlName="password"
      [withErrors]="true"
    />
  </div>
  <button class="registration-form__button" (click)="registration()">
    Зареєструватися
  </button>
  <button class="registration-form__button--login" (click)="login()">
    Я вже зареєстрований(-на)
  </button>
</div>
